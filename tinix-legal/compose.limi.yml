name: limi-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${LIMI_POSTGRES_USER:?Set LIMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LIMI_POSTGRES_PASSWORD:?Set LIMI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LIMI_POSTGRES_DB:?Set LIMI_POSTGRES_DB}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: limi-minio:dev-20251015
    pull_policy: build
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
