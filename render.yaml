# Render Blueprint for LIMI (free plan). Dashboard → New → Blueprint → pick this repo.
# Free-plan limits: the web service sleeps after 15 min idle; the free Postgres expires after 30 days.
databases:
  - name: limi-db
    plan: free
    region: singapore
    databaseName: limi
    user: limi
    ipAllowList: []          # private network only

services:
  - type: keyvalue
    name: limi-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction   # BullMQ queues must not be evicted
    ipAllowList: []

  # Single web service: Next.js on $PORT plus the Express API (and its worker/scheduler jobs) on 127.0.0.1:4010.
  # Two public services calling each other were throttled by Render's edge (HTTP 429), and the free plan
  # has no private network — so both run in one instance (see render-start.sh).
  - type: web
    name: limi-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      cd tinix-legal && npm install --include=dev --no-audit --no-fund && npm run build:mvp &&
      cd ../limi-product && npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: bash render-start.sh
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LIMI_API_URL
        value: http://127.0.0.1:4010
      - key: API_HOST
        value: 127.0.0.1
      - key: API_PORT
        value: "4010"
      - key: WORKER_HEALTH_PORT
        value: "4011"
      - key: SCHEDULER_HEALTH_PORT
        value: "4012"
      - key: LIMI_EMBED_JOBS
        value: "true"
      - key: HEALTH_TIMEOUT_MS
        value: "4000"
      - key: ALLOWED_ORIGINS
        value: https://limi-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: limi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: limi-redis
          property: connectionString
      # Evidence files: Cloudflare R2 (S3-compatible, free 10 GB). Placeholders work until R2 is set up.
      - key: MINIO_ENDPOINT        # <account-id>.r2.cloudflarestorage.com
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: limi-evidence
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_REGION
        value: auto
